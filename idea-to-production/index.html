<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Idea to production</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="sticky-bar" id="sticky-bar">
    <div
      class="progress"
      data-testid="progress"
      data-progress="0"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      aria-label="Mean mastery across eight skills"
    >
      <div class="progress-copy">
        <span class="progress-kicker">Mastery</span>
        <span id="progress-text">0 percent</span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
    <div class="sticky-tools">
      <button type="button" id="mini-radar-btn" class="icon-btn" aria-label="Open mastery radar">
        <span id="mini-radar" class="mini-radar" aria-hidden="true"></span>
      </button>
      <div class="review-chip" data-testid="review-deck">
        <span data-testid="review-count" data-value="0" id="review-count">0 due</span>
        <button type="button" data-testid="review-start" id="review-start">Review</button>
      </div>
      <label class="search-wrap" for="search-input">
        <span class="sr-only">Search the lesson</span>
        <input id="search-input" data-testid="search-input" type="search" placeholder="Search" autocomplete="off" />
      </label>
      <button type="button" data-testid="chapter-nav-toggle" id="chapter-nav-toggle" aria-expanded="false" aria-controls="chapter-nav">Jump</button>
    </div>
    <div id="search-results" class="search-results" hidden></div>
    <nav id="chapter-nav" data-testid="chapter-nav" hidden></nav>
  </div>

  <div id="review-sheet" class="sheet" hidden>
    <div data-testid="review-card" id="review-card" class="sheet-card"></div>
  </div>

  <header data-testid="hero" class="hero">
    <p class="kicker">A tap-through course</p>
    <h1>Idea to production</h1>
    <p class="lede">From a thought to a live app you can watch. You will decide, calculate, fail, fix, and prove. Told like you are six. Every fact comes from two research files.</p>
    <button type="button" id="start-btn">Start</button>
  </header>

  <main id="app" class="app"></main>
  <script src="assets/data.js"></script>
  <script src="assets/data-more.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
