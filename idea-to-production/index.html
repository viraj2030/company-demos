<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Idea to production</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div
    class="progress"
    data-testid="progress"
    data-progress="0"
    role="progressbar"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="0"
    aria-label="Lesson progress"
  >
    <div class="progress-copy">
      <span class="progress-kicker">Progress</span>
      <span id="progress-text">0 percent</span>
    </div>
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <header data-testid="hero" class="hero">
    <p class="kicker">A tap-through lesson</p>
    <h1>Idea to production</h1>
    <p class="lede">How a thought becomes a live app. Told like you are six. Every fact on this page comes from one research file. None of it was invented.</p>
    <button type="button" id="start-btn">Start</button>
  </header>

  <main id="app" class="app"></main>
  <script src="assets/app.js" defer></script>
</body>
</html>
